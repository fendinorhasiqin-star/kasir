<script>
const FREE_PRODUCT_LIMIT = Infinity; // versi offline: produk tanpa batas
const SINKRON_PRODUK_SIAP = false; // versi offline: tidak ada sinkronisasi / database online
const ACTIVATION_CODE = ''; // versi offline: tidak perlu kode aktivasi
const WHATSAPP_NUMBER = '6287875015256'; // Opsional: nomor internasional tanpa tanda +, spasi, atau strip.
const defaultProducts = [];
const loadData = (key, fallback) => {
  try { return JSON.parse(localStorage.getItem('posoff_' + key)) || fallback; }
  catch (error) { return fallback; }
};
const data = {
  products: loadData('products', defaultProducts),
  suppliers: loadData('suppliers', [{ id: 1, name: 'PT Sumber Pangan', phone: '081234567890' }]),
  customers: loadData('customers', [{ id: 1, name: 'Budi Santoso', phone: '081298765432' }]),
  debts: loadData('debts', []),
  transactions: loadData('transactions', []),
  purchases: loadData('purchases', []),
  settings: loadData('settings', { shop: 'TOKO SEMBAKO', admin: 'Admin' }),
  cart: []
};
let activeFeature = 'Dashboard';
let featureHistory = [];
let featureHistoryDepth = 0;
let featureSessionId = null;
let restoringFeature = false;
let reportState = { period: 'today', start: '', end: '' };
let reportBestSellerList = [];

/* ===== Pengaturan stok kosong ===== */
const DEFAULT_EMPTY_STOCK = 0;
function getEmptyStock() { const v = data.settings.emptyStock; return v === 0 || v === 1 ? v : DEFAULT_EMPTY_STOCK; }
function ignoreStockLimit() { return getEmptyStock() === 1; }
function saveStockSetting(value) {
  data.settings.emptyStock = Number(value) === 1 ? 1 : 0;
  saveData();
  alert('Pengaturan stok disimpan: produk stok 0 ' + (data.settings.emptyStock === 1 ? 'tetap bisa dijual.' : 'tidak bisa dijual.'));
}
function saveData() {
  ['products', 'suppliers', 'customers', 'debts', 'transactions', 'purchases', 'settings'].forEach(key => {
    localStorage.setItem('posoff_' + key, JSON.stringify(data[key]));
  });
}
function rupiah(value) {
  return 'Rp ' + Number(value || 0).toLocaleString('id-ID');
}
const MONEY_ATTRS = 'type="text" inputmode="numeric" autocomplete="off" class="money-input"';
function formatMoney(value) {
  const digits = String(value ?? '').replace(/\D/g, '');
  return digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
}
function moneyNumber(value) {
  return Number(String(value ?? '').replace(/\./g, '').trim());
}
function playAddToCartSound() {
  try {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioContextClass) return;
    const audio = new AudioContextClass();
    const oscillator = audio.createOscillator();
    const volume = audio.createGain();
    oscillator.type = 'sine';
    oscillator.frequency.value = 880;
    volume.gain.setValueAtTime(0.08, audio.currentTime);
    volume.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.12);
    oscillator.connect(volume);
    volume.connect(audio.destination);
    oscillator.start();
    oscillator.stop(audio.currentTime + 0.12);
    oscillator.onended = () => audio.close();
  } catch (error) { /* Abaikan jika audio tidak didukung atau diblokir browser. */ }
}
document.addEventListener('input', event => {
  const input = event.target;
  if (!input || !input.matches || !input.matches('input.money-input')) return;
  const caret = input.selectionStart ?? input.value.length;
  const digitsBeforeCaret = input.value.slice(0, caret).replace(/\D/g, '').length;
  const formatted = formatMoney(input.value);
  if (formatted === input.value) return;
  input.value = formatted;
  let position = 0, seen = 0;
  while (position < formatted.length && seen < digitsBeforeCaret) { if (/\d/.test(formatted[position])) seen++; position++; }
  try { input.setSelectionRange(position, position); } catch (error) { /* abaikan */ }
});
function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[char]));
}
function syncNavigation(feature) {
  const activeLabel = ({
    'Home': 'Home', 'Dashboard': 'Home',
    'Kasir': 'Kasir', 'Keranjang': 'Kasir',
    'Produk': 'Produk', 'Laporan': 'Laporan', 'Lainnya': 'Lainnya', 'Profil': 'Lainnya'  })[feature] || 'Lainnya';
  document.querySelectorAll('.nav-item').forEach(item => {
    const on = item.textContent.trim() === activeLabel && activeLabel !== '';
    item.classList.toggle('active', on);
    if (on) item.setAttribute('aria-current', 'page'); else item.removeAttribute('aria-current');
  });
}
function closeFeature(fromHistory = false) {
  const depth = featureHistoryDepth;
  featureHistory = [];
  featureHistoryDepth = 0;
  featureSessionId = null;
  document.getElementById('featureModal').classList.remove('open', 'cashier-mode');
  syncNavigation('Home');
  if (!fromHistory && depth > 0) history.go(-depth);
}
function showFeature(title, html) {
  const modal = document.getElementById('featureModal');
  const isOpen = modal.classList.contains('open');
  if (!isOpen && !restoringFeature) {
    featureHistory = [];
    featureSessionId = `${Date.now()}-${Math.random()}`;
    featureHistoryDepth = 1;
    history.pushState({ ...(history.state || {}), posFeatureSession: featureSessionId }, '');
  } else if (!restoringFeature && isOpen && activeFeature !== title) {
    featureHistory.push(activeFeature);
    featureHistoryDepth++;
    history.pushState({ ...(history.state || {}), posFeatureSession: featureSessionId }, '');
  }
  activeFeature = title;
  modal.classList.toggle('cashier-mode', title === 'Keranjang' || title === 'Kasir');
  document.getElementById('featureTitle').textContent = title;
  document.getElementById('featureContent').innerHTML = html;
  document.getElementById('featureContent').querySelectorAll('input, textarea, select, form').forEach(element => {
    if (element.matches('form')) element.autocomplete = 'off';
    else {
      element.autocomplete = 'off';
      element.spellcheck = false;
      element.setAttribute('autocorrect', 'off');
      element.setAttribute('autocapitalize', 'off');
      element.setAttribute('data-1p-ignore', 'true');
      element.setAttribute('data-lpignore', 'true');
    }
  });
  modal.classList.add('open');
  syncNavigation(title);
}
function backFeature() {
  if (featureSessionId && history.state?.posFeatureSession === featureSessionId) {
    history.back();
    return;
  }
  const previous = featureHistory.pop();
  if (!previous) return closeFeature(true);
  featureHistoryDepth = Math.max(1, featureHistoryDepth - 1);
  restoringFeature = true;
  openMenu(previous);
  restoringFeature = false;
}
function emptyMessage(text) { return `<div class="feature-empty">${text}</div>`; }
function productOptions(selectedId = null) {
  return data.products.map(product => `<option value="${product.id}" ${product.id === selectedId ? 'selected' : ''}>${escapeHTML(product.name)} — ${rupiah(product.price)} (stok ${product.stock})</option>`).join('');
}
function supplierOptions() {
  return data.suppliers.map(supplier => `<option value="${supplier.id}">${escapeHTML(supplier.name)}</option>`).join('');
}
function openMenu(menu) {
  if (window.Akses && !Akses.jaga(menu)) return;
  const contents = {
    'Keranjang': renderCashier(), 'Kasir': renderCashier(),
    'Produk': renderProducts(), 'Stok Barang': renderStock(),
    'Tambah/Kurangi Stok': renderStockAdjustments(), 'Cek Stok Menipis': renderLowStock(),
    'Pembelian': renderPurchases(), 'Riwayat Pembelian': renderPurchaseHistoryPage(), 'Supplier': renderSuppliers(),
    'Pelanggan': renderCustomers(), 'Import/Ekspor Pelanggan': renderCustomerImportExport(), 'Hutang': renderDebts(), 'Import/Ekspor Hutang': renderDebtImportExport(),
    'Import/Ekspor Produk': renderProductImportExportPage(),
    'Laporan': renderReports(), 'Riwayat': renderHistory(),
    'Pengaturan': renderSettings(), 'Profil': renderProfile(), 'Lainnya': renderLainnya()
  };
  showFeature(menu, contents[menu] || emptyMessage('Fitur tidak ditemukan.'));
}
function renderCashier() {
  const itemCount = data.cart.reduce((sum, item) => sum + item.qty, 0);
  const total = data.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const cartMarkup = data.cart.length ? `<div class="cashier-cart">${data.cart.map(item => `<article class="cashier-cart-item">
    <div class="cashier-item-top"><strong>${escapeHTML(item.name)}</strong><button class="cashier-remove" type="button" onclick="removeFromCartById(${item.id})" aria-label="Hapus ${escapeHTML(item.name)}"><i class="fa-solid fa-trash-can"></i></button></div>
    <div class="cashier-item-bottom">
      <button class="cashier-price-edit" type="button" onclick="editCartPrice(${item.id})">${rupiah(item.price)}${item.unit ? ` · ${escapeHTML(item.unit)}` : ''} <i class="fa-solid fa-pen"></i></button>
      <div class="cashier-quantity"><button type="button" onclick="changeCartQuantity(${item.id}, -1)" aria-label="Kurangi jumlah">−</button><strong>${item.qty}</strong><button type="button" onclick="changeCartQuantity(${item.id}, 1)" aria-label="Tambah jumlah">+</button></div>
      <strong class="cashier-line-total">${rupiah(item.price * item.qty)}</strong>
    </div>
  </article>`).join('')}</div>` : '<div class="cashier-empty">Keranjang masih kosong.<br>Cari atau scan produk untuk mulai berbelanja.</div>';
  return `<header class="cashier-page-header"><strong><i class="fa-solid fa-cart-shopping" aria-hidden="true" style="margin-right:8px"></i>Keranjang</strong><span><i class="fa-solid fa-user" style="margin-right:5px"></i>${escapeHTML(data.settings.admin)}</span></header>
    <main class="cashier-page-content">
      <div class="cashier-search">
        <input id="cashierSearch" type="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Scan / ketik nama atau barcode" oninput="searchCashierProducts()" aria-label="Cari nama atau barcode produk">
        <button class="camera-button" type="button" onclick="scanProductBarcode()" aria-label="Scan barcode produk"><i class="fa-solid fa-barcode"></i></button>
      </div>
      <div class="cashier-results" id="cashierResults"></div>${cartMarkup}
    </main>
    <footer class="cashier-bottom">
      <div class="cashier-total"><div><small>${itemCount} barang</small><strong>${rupiah(total)}</strong></div><button class="feature-button cashier-pay" type="button" onclick="openPayment()" ${!data.cart.length ? 'disabled' : ''}>Bayar ›</button></div>
            <nav class="bottom-nav cashier-bottom-nav" aria-label="Navigasi utama">
        <button class="nav-item" type="button" data-nav="Home"><i class="fa-solid fa-house" aria-hidden="true"></i>Home</button>
        <button class="nav-item" type="button" data-nav="Produk"><i class="fa-solid fa-box-open" aria-hidden="true"></i>Produk</button>
        <button class="nav-item cashier-nav-item active" type="button" data-nav="Kasir" aria-current="page"><i class="fa-solid fa-cart-shopping" aria-hidden="true"></i>Kasir</button>
        <button class="nav-item" type="button" data-nav="Laporan"><i class="fa-solid fa-chart-column" aria-hidden="true"></i>Laporan</button>
        <button class="nav-item" type="button" data-nav="Lainnya"><i class="fa-solid fa-table-cells-large" aria-hidden="true"></i>Lainnya</button>
      </nav>
    </footer>`;
}
function refreshKeepingScroll() {
  const content = document.getElementById('featureContent');
  const list = content.querySelector('.cashier-page-content');
  const listTop = list ? list.scrollTop : 0;
  const contentTop = content.scrollTop;
  openMenu(activeFeature);
  const newList = content.querySelector('.cashier-page-content');
  if (newList) newList.scrollTop = listTop;
  content.scrollTop = contentTop;
}
function removeFromCartById(id) {
  data.cart = data.cart.filter(item => item.id !== id);
  refreshKeepingScroll();
}
function changeCartQuantity(id, change) {
  const item = data.cart.find(product => product.id === id);
  const product = data.products.find(product => product.id === id);
  if (!item || (!product && !item.quick)) return;
  if (change > 0 && !item.quick && !ignoreStockLimit() && item.qty >= product.stock) return alert('Stok tidak mencukupi.');
  if (change > 0) playAddToCartSound();
  item.qty += change;
  if (item.qty < 1) data.cart = data.cart.filter(product => product.id !== id);
  refreshKeepingScroll();
}
function editCartPrice(id) {
  const item = data.cart.find(product => product.id === id);
  if (!item) return;
  document.getElementById('cartPriceOverlay')?.remove();
  document.getElementById('featureContent').insertAdjacentHTML('beforeend', `<div class="payment-overlay" id="cartPriceOverlay" onclick="if(event.target === this) closeCartPrice()">
    <section class="payment-box" role="dialog" aria-modal="true" aria-labelledby="cartPriceTitle">
      <div class="feature-header"><h2 id="cartPriceTitle">Ubah harga item</h2><button class="feature-close" type="button" onclick="closeCartPrice()" aria-label="Tutup">&times;</button></div>
      <form class="feature-form" onsubmit="saveCartPrice(event, ${id})">
        <label for="cartItemPrice">Harga jual per unit</label>
        <input id="cartItemPrice" name="price" ${MONEY_ATTRS} value="${formatMoney(item.price)}" required>
        <div class="feature-row"><button class="feature-button secondary" type="button" onclick="closeCartPrice()">Batal</button><button type="submit">Simpan harga</button></div>
      </form>
    </section>
  </div>`);
  document.getElementById('cartItemPrice').focus({ preventScroll: true });
}
function closeCartPrice() {
  document.getElementById('cartPriceOverlay')?.remove();
}
function saveCartPrice(event, id) {
  event.preventDefault();
  const item = data.cart.find(product => product.id === id);
  if (!item) return closeCartPrice();
  const value = event.currentTarget.elements.namedItem('price').value.trim();
  const price = moneyNumber(value);
  if (!value || !Number.isFinite(price) || price < 0) return alert('Harga harus berupa angka nol atau lebih.');
  item.price = price;
  refreshKeepingScroll();
}
function searchCashierProducts() {
  const query = document.getElementById('cashierSearch').value.trim().toLocaleLowerCase('id-ID');
  const results = document.getElementById('cashierResults');
  if (!query) { results.innerHTML = ''; return; }
  const matches = data.products.filter(product => `${product.name} ${product.barcode || ''}`.toLocaleLowerCase('id-ID').includes(query) && (product.stock > 0 || ignoreStockLimit()));
  results.innerHTML = matches.length ? matches.map(product => `<button class="cashier-product" type="button" onclick="addProductToCart(${product.id})"><strong>${escapeHTML(product.name)}</strong><small><b class="price-strong">${rupiah(product.price)}</b>${product.unit ? ' · ' + escapeHTML(product.unit) : ''} · Stok ${product.stock}</small></button>`).join('') : emptyMessage('Produk tidak ditemukan atau stok habis.');
}
function addProductToCart(id) {
  const product = data.products.find(item => item.id === id);
  if (!product || (product.stock < 1 && !ignoreStockLimit())) return alert('Stok produk habis.');
  const existing = data.cart.find(item => item.id === id);
  if (existing) {
    if (!ignoreStockLimit() && existing.qty >= product.stock) return alert('Stok tidak mencukupi.');
    existing.qty++;
  } else data.cart.push({ id, name: product.name, unit: product.unit || '', price: product.price, cost: product.cost, qty: 1 });
  playAddToCartSound();
  refreshKeepingScroll();
}
function openPayment() {
  if (!data.cart.length) return;
  const total = data.cart.reduce((sum, item) => sum + item.price * item.qty, 0);
  const quickAmounts = [...new Set([
    Math.ceil(total / 10000) * 10000,
    Math.ceil(total / 50000) * 50000,
    Math.ceil(total / 100000) * 100000
  ])];
  document.getElementById('featureContent').insertAdjacentHTML('beforeend', `<div class="payment-overlay" id="paymentOverlay" onclick="if(event.target === this) closePayment()">
    <section class="payment-box" role="dialog" aria-modal="true" aria-labelledby="paymentTitle">
      <div class="feature-header"><h2 id="paymentTitle">Pembayaran</h2><button class="feature-close" type="button" onclick="closePayment()" aria-label="Tutup">&times;</button></div>
      <div class="payment-total"><small>Total pembayaran</small><strong>${rupiah(total)}</strong></div>
      <form class="feature-form" onsubmit="checkout(event)">
        <input name="customer" placeholder="Nama pelanggan (opsional)">
        <label for="cashReceived">Uang diterima</label>
        <input id="cashReceived" name="cash" ${MONEY_ATTRS} placeholder="Masukkan jumlah uang" oninput="updateChange()" required>
        <div class="payment-quick-amounts" aria-label="Pilihan nominal cepat">

function savePurchase(event) {
  event.preventDefault();
  const form = event.currentTarget;
  const purchaseId = Number(form.elements.namedItem('purchaseId')?.value || 0);
  const purchaseIndex = purchaseId ? data.purchases.findIndex(item => item.id === purchaseId && !item.cancelled) : -1;
  const editingPurchase = purchaseIndex >= 0 ? data.purchases[purchaseIndex] : null;
  if (purchaseId && !editingPurchase) return alert('Transaksi pembelian tidak ditemukan atau sudah dibatalkan.');
  const supplier = data.suppliers.find(item => item.id === Number(form.elements.namedItem('supplier').value));
  const purchaseDate = form.elements.namedItem('date').value;
  const rows = [...form.querySelectorAll('.purchase-item-row')];
  const items = rows.map(row => {
    const product = data.products.find(item => item.id === Number(row.querySelector('[name="product"]').value));
    const qty = Number(row.querySelector('[name="qty"]').value);
    const cost = moneyNumber(row.querySelector('[name="cost"]').value);
    return product && Number.isInteger(qty) && qty > 0 && Number.isFinite(cost) && cost >= 0
      ? { product, qty, cost } : null;
  });
  if (!supplier || !purchaseDate || !items.length || items.some(item => !item)) return alert('Periksa kembali data pembelian.');
  const duplicateProducts = new Set();
  for (const item of items) {
    if (duplicateProducts.has(item.product.id)) return alert('Produk yang sama tidak boleh ditambahkan lebih dari sekali. Gabungkan jumlahnya dalam satu baris.');
    duplicateProducts.add(item.product.id);
  }
  const oldItems = editingPurchase ? getPurchaseItems(editingPurchase) : [];
  if (editingPurchase && oldItems.some(item => !data.products.some(product => product.id === item.productId))) return alert('Ada produk lama yang sudah tidak ditemukan. Pembelian tidak dapat diedit dengan aman.');
  const stockChanges = new Map();
  oldItems.forEach(item => stockChanges.set(item.productId, (stockChanges.get(item.productId) || 0) - Number(item.qty || 0)));
  items.forEach(({ product, qty }) => stockChanges.set(product.id, (stockChanges.get(product.id) || 0) + qty));
  for (const [productId, change] of stockChanges) {
    const product = data.products.find(item => item.id === productId);
    if (!product || product.stock + change < 0) return alert(`Stok ${product?.name || 'produk'} tidak cukup untuk menyimpan perubahan pembelian.`);
  }
  const purchaseItems = items.map(({ product, qty, cost }) => {
    const previousItem = oldItems.find(item => item.productId === product.id);
    return { productId: product.id, productName: product.name, qty, cost, total: qty * cost,
      previousCost: previousItem ? (Number(previousItem.previousCost) || 0) : (Number(product.cost) || 0) };
  });
  if (editingPurchase) {
    const hasNewerPurchase = productId => data.purchases.slice(0, purchaseIndex).some(candidate =>
      !candidate.cancelled && getPurchaseItems(candidate).some(item => item.productId === productId)
    );
    oldItems.forEach(oldItem => {
      if (!items.some(item => item.product.id === oldItem.productId) && !hasNewerPurchase(oldItem.productId)) {
        const product = data.products.find(item => item.id === oldItem.productId);
        product.cost = Number(oldItem.previousCost) || 0;
      }
    });
    items.forEach(({ product, cost }) => {
      if (!hasNewerPurchase(product.id)) product.cost = cost;
    });
    stockChanges.forEach((change, productId) => {
      data.products.find(item => item.id === productId).stock += change;
    });
    editingPurchase.supplierId = supplier.id;
    editingPurchase.supplierName = supplier.name;
    editingPurchase.items = purchaseItems;
    editingPurchase.total = purchaseItems.reduce((sum, item) => sum + item.total, 0);
    editingPurchase.paymentStatus = form.elements.namedItem('paymentStatus').value;
    editingPurchase.date = `${purchaseDate}T12:00:00`;

      const rawId = value('id');
      const name = value('name');
      const amount = Number(value('amount'));
      const remaining = value('remaining') === '' ? amount : Number(value('remaining'));

    });

function csvEscape(value) {
  const text = String(value ?? '');
  return /[",\r\n]/.test(text) ? `"${text.replace(/"/g, '""')}"` : text;
}
function expandScientificNumber(value) {
  const text = String(value ?? '').trim().replace(',', '.');
  const match = text.match(/^([+-]?)(\d*)(?:\.(\d*))?[eE]([+-]?\d+)$/);
  if (!match) return text;
  const sign = match[1] === '-' ? '-' : '';
  const integer = match[2] || '';
  const fraction = match[3] || '';
  const digits = integer + fraction;
  const decimalPosition = integer.length + Number(match[4]);
  if (decimalPosition <= 0) return `${sign}0.${'0'.repeat(-decimalPosition)}${digits}`;
  if (decimalPosition >= digits.length) return `${sign}${digits}${'0'.repeat(decimalPosition - digits.length)}`;
  return `${sign}${digits.slice(0, decimalPosition)}.${digits.slice(decimalPosition)}`;
}
function exportProductsCSV() {
  const columns = [['id', 'id'], ['nama', 'name'], ['satuan', 'unit'], ['harga', 'price'], ['modal', 'cost'], ['stok', 'stock'], ['barcode', 'barcode']];
  const rows = [columns.map(([header]) => header), ...data.products.map(product => columns.map(([, key]) => {
    if (key !== 'barcode') return product[key] ?? '';
    const barcode = expandScientificNumber(product.barcode);
    return /^\d+$/.test(barcode) ? `="${barcode}"` : barcode;
  }))];
  const csv = '\uFEFF' + rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const link = document.createElement('a');
  link.href = url;
  link.download = 'produk-toko.csv';
  link.click();
  URL.revokeObjectURL(url);
}
function parseCSV(text) {
  const rows = [];
  const firstLine = text.split(/\r?\n/, 1)[0] || '';
  const delimiter = (firstLine.match(/;/g) || []).length > (firstLine.match(/,/g) || []).length ? ';' : ',';
  let row = [], field = '', quoted = false;
  for (let index = 0; index < text.length; index++) {
    const char = text[index];
    if (quoted) {
      if (char === '"' && text[index + 1] === '"') { field += '"'; index++; }
      else if (char === '"') quoted = false;
      else field += char;
    } else if (char === '"' && field === '') quoted = true;
    else if (char === delimiter) { row.push(field); field = ''; }
    else if (char === '\n' || char === '\r') {
      if (char === '\r' && text[index + 1] === '\n') index++;
      row.push(field); field = '';
      if (row.some(cell => cell.trim() !== '')) rows.push(row);
      row = [];
    } else field += char;
  }
  if (quoted) throw new Error('Ada tanda kutip CSV yang belum ditutup.');
  row.push(field);
  if (row.some(cell => cell.trim() !== '')) rows.push(row);
  return rows;
}

async function importCustomersCSV(event) {

    const headers = rows[0].map(header => header.trim().toLocaleLowerCase('id-ID'));

    if (indexOf('name') < 0) throw new Error('CSV wajib memiliki kolom name.');

      if (customer.phone && seenPhones.has(customer.phone)) throw new Error(`Nomor telepon duplikat: ${customer.phone}`);

      if (customer.phone) seenPhones.add(customer.phone);
    });
    imported.forEach(item => {

        || (item.phone && data.customers.find(customer => String(customer.phone || '') === item.phone))
        || data.customers.find(customer => customer.name.trim().toLocaleLowerCase('id-ID') === item.name.toLocaleLowerCase('id-ID'));
      if (existing) Object.assign(existing, { name: item.name, phone: item.phone });
      else {
        const id = item.id && !data.customers.some(customer => String(customer.id) === item.id) ? Number(item.id) : Date.now() + Math.floor(Math.random() * 1000000);

      }
    });

    alert(error.message || 'File CSV tidak dapat dibaca.');
  } finally {
    input.value = '';
  }
}

      throw new Error('File Excel tidak dapat dibuka di browser ini. Coba simpan sebagai CSV.');
    }
  };
  const parseXML = (text, label) => {
    if (!text) throw new Error(`File Excel tidak memiliki ${label}.`);
    const xml = new DOMParser().parseFromString(text, 'application/xml');
    if (xml.querySelector('parsererror')) throw new Error(`Format ${label} pada file Excel tidak valid.`);
    return xml;
  };
  const workbook = parseXML(await readEntry('xl/workbook.xml'), 'lembar kerja');
  const firstSheet = workbook.getElementsByTagName('sheet')[0];
  if (!firstSheet) throw new Error('File Excel tidak memiliki lembar kerja.');
  const relationId = firstSheet.getAttribute('r:id') || firstSheet.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships', 'id');
  let sheetPath = 'xl/worksheets/sheet1.xml';
  const relationshipsText = await readEntry('xl/_rels/workbook.xml.rels');
  if (relationshipsText && relationId) {
    const relationships = parseXML(relationshipsText, 'relasi lembar kerja');
    const relationship = [...relationships.getElementsByTagName('Relationship')].find(item => item.getAttribute('Id') === relationId);
    if (relationship) {
      const target = relationship.getAttribute('Target').replace(/^\//, '');
      sheetPath = target.startsWith('xl/') ? target : `xl/${target.replace(/^\.\//, '')}`;
    }
  }
  const sharedStringsText = await readEntry('xl/sharedStrings.xml');
  const sharedStrings = sharedStringsText ? [...parseXML(sharedStringsText, 'teks bersama').getElementsByTagName('si')].map(item =>
    [...item.getElementsByTagName('t')].map(text => text.textContent).join('')
  ) : [];
  const worksheet = parseXML(await readEntry(sheetPath), 'lembar Excel');
  const rows = [];
  for (const rowElement of worksheet.getElementsByTagName('row')) {
    const rowNumber = Number(rowElement.getAttribute('r')) || rows.length + 1;
    const row = rows[rowNumber - 1] || (rows[rowNumber - 1] = []);
    for (const cell of rowElement.getElementsByTagName('c')) {
      const reference = cell.getAttribute('r') || '';
      const letters = reference.match(/[A-Z]+/i)?.[0] || '';
      let column = 0;
      for (const letter of letters.toUpperCase()) column = column * 26 + letter.charCodeAt(0) - 64;
      if (!column) continue;
      const type = cell.getAttribute('t');
      let value = '';
      if (type === 'inlineStr') value = [...cell.getElementsByTagName('t')].map(text => text.textContent).join('');
      else {
        const raw = cell.getElementsByTagName('v')[0]?.textContent ?? '';
        value = type === 's' ? (sharedStrings[Number(raw)] ?? '') : raw;
      }
      row[column - 1] = value;
    }
  }
  return rows.filter(Boolean);
}
async function importProductsCSV(event) {
  if (!wajibLogin()) { event.currentTarget.value = ''; return; }
  const input = event.currentTarget;
  const file = input.files[0];
  if (!file) return;
  try {
    const rows = /\.xlsx$/i.test(file.name)
      ? await parseXLSX(file)
      : parseCSV((await file.text()).replace(/^\uFEFF/, ''));
    if (rows.length < 2) throw new Error('File tidak berisi data produk.');
    const headers = rows[0].map(header => header.trim().toLocaleLowerCase('id-ID').replace(/\s+/g, ' '));
    const indexOf = (...names) => names.map(name => headers.indexOf(name)).find(index => index >= 0) ?? -1;
    const requiredNameIndex = indexOf('nama', 'produk', 'barang', 'nama barang', 'nama produk', 'product', 'product name', 'item', 'item name');
    const requiredPriceIndex = indexOf('harga', 'harga jual', 'price', 'selling price');
    if (requiredNameIndex < 0 || requiredPriceIndex < 0) throw new Error('File wajib memiliki kolom nama/produk/barang atau product, serta harga atau price.');
    let skipped = 0;
    let imported = rows.slice(1).map((row, rowIndex) => {
      if (!row || row.every(cell => !String(cell ?? '').trim())) return null;
      const value = (...names) => {
        const index = indexOf(...names);
        return index < 0 ? '' : (row[index] || '').trim();
      };
      const id = value('id');
      const name = value('nama', 'produk', 'barang', 'nama barang', 'nama produk', 'product', 'product name', 'item', 'item name');
      const price = Number(value('harga', 'harga jual', 'price', 'selling price'));
      const costValue = value('modal', 'cost', 'purchase price', 'cost price');
      const stockValue = value('stok', 'stock', 'quantity', 'qty');
      const cost = costValue === '' ? 0 : Number(costValue);
      const stock = stockValue === '' ? 0 : Number(stockValue);
      if (!name || !Number.isFinite(price) || price < 0 || !Number.isFinite(cost) || cost < 0 || !Number.isInteger(stock) || stock < 0 || (id && (!Number.isSafeInteger(Number(id)) || Number(id) < 1))) {
        skipped++;
        return null;
      }
      const rawBarcode = value('barcode');
      const barcodeText = rawBarcode.match(/^="([^"]*)"$/)?.[1] ?? (rawBarcode.startsWith("'") ? rawBarcode.slice(1) : rawBarcode);
      const barcode = expandScientificNumber(barcodeText);
      return { id, name, price, cost, stock, unit: value('satuan', 'unit'), barcode };
    }).filter(Boolean);
    const seenIds = new Set(), seenBarcodes = new Set();
    imported = imported.filter(product => {
      if ((product.id && seenIds.has(product.id)) || (product.barcode && seenBarcodes.has(product.barcode))) { skipped++; return false; }
      if (product.id) seenIds.add(product.id);
      if (product.barcode) seenBarcodes.add(product.barcode);
      return true;
    });
    if (!imported.length) throw new Error('Tidak ada baris produk yang valid untuk diimpor.');
    if (!confirm(`Impor ${imported.length} produk?${skipped ? ` ${skipped} baris tidak valid akan dilewati.` : ''} Produk yang cocok akan diperbarui, lainnya ditambahkan.`)) return;
    if (!data.settings.unlimitedProducts) {
      const projectedProducts = [...data.products];
      for (const item of imported) {
        const existing = (item.id && projectedProducts.find(product => String(product.id) === item.id))
          || (item.barcode && projectedProducts.find(product => String(product.barcode || '') === item.barcode))
          || projectedProducts.find(product => product.name.trim().toLocaleLowerCase('id-ID') === item.name.toLocaleLowerCase('id-ID'));
        if (!existing) projectedProducts.push({ id: item.id || `import-${projectedProducts.length}`, name: item.name, barcode: item.barcode });
      }
      if (projectedProducts.length > FREE_PRODUCT_LIMIT) {
        showProductLimitNotice();
        return;
      }
    }
    imported.forEach(item => {
      const existing = (item.id && data.products.find(product => String(product.id) === item.id))
        || (item.barcode && data.products.find(product => String(product.barcode || '') === item.barcode))
        || data.products.find(product => product.name.trim().toLocaleLowerCase('id-ID') === item.name.toLocaleLowerCase('id-ID'));
      const values = { name: item.name, unit: item.unit, price: item.price, cost: item.cost, stock: item.stock, barcode: item.barcode };
      if (existing) Object.assign(existing, values);
      else {
        const id = item.id && !data.products.some(product => String(product.id) === item.id) ? Number(item.id) : Date.now() + Math.floor(Math.random() * 1000000);
        data.products.push({ id, ...values });
      }
    });
    saveData();
    alert(`${imported.length} produk berhasil diimpor.${skipped ? ` ${skipped} baris tidak valid dilewati.` : ''}`);
  } catch (error) {
    alert(error.message || 'File CSV tidak dapat dibaca.');
  } finally {
    input.value = '';
  }
}

function transactionProfit(transaction) { return (transaction.items || []).reduce((sum, item) => sum + (item.price - (item.cost || 0)) * (item.qty || 1), 0); }
let periodeAktif = 'minggu';
function rentangPeriode(k) {
  const n = new Date(); let s, ps, pe;
  if (k === 'hari') {
    s = new Date(n.getFullYear(), n.getMonth(), n.getDate());
    ps = new Date(s); ps.setDate(ps.getDate() - 1);
    pe = new Date(n); pe.setDate(pe.getDate() - 1);
  } else if (k === 'minggu') {
    const dow = (n.getDay() + 6) % 7;
    s = new Date(n.getFullYear(), n.getMonth(), n.getDate() - dow);
    ps = new Date(s); ps.setDate(ps.getDate() - 7);
    pe = new Date(n); pe.setDate(pe.getDate() - 7);
  } else {
    s = new Date(n.getFullYear(), n.getMonth(), 1);
    ps = new Date(n.getFullYear(), n.getMonth() - 1, 1);
    const hariPrev = new Date(n.getFullYear(), n.getMonth(), 0).getDate();
    pe = new Date(n.getFullYear(), n.getMonth() - 1, Math.min(n.getDate(), hariPrev), n.getHours(), n.getMinutes());
  }
  return { s, e: n, ps, pe };
}
function hitungPeriode(a, b) {
  let omzet = 0, laba = 0, tx = 0, item = 0;
  data.transactions.forEach(t => {
    const d = new Date(t.date);
    if (d >= a && d <= b) {
      omzet += t.total; laba += transactionProfit(t); tx++;
      item += (t.items || []).reduce((s, i) => s + (i.qty || 1), 0);
    }
  });
  return { omzet, laba, tx, item };
}
function setTren(id, now, prev, label) {
  const el = document.getElementById(id); if (!el) return;
  if (!prev) { el.innerHTML = '<i class="fa-solid fa-arrow-up"></i> <b>Baru</b>'; el.className = 'bh-trend'; return; }
  const pct = Math.round((now - prev) / prev * 100);
  el.innerHTML = '<i class="fa-solid fa-arrow-' + (pct >= 0 ? 'up' : 'down') + '"></i> <b>' + Math.abs(pct) + '%</b> dari ' + label;
  el.className = 'bh-trend' + (pct < 0 ? ' down' : '');
}

/* ===== BERANDA: nominal Omzet / Laba Kotor mengecil otomatis agar tidak keluar dari kartu ===== */
(function () {
  let busy = false;
  function fitBhValues() {
    if (busy) return; busy = true;
    const vs = [...document.querySelectorAll('.bh-st .v')], sizes = [];
    vs.forEach(v => {
      v.style.fontSize = '';
      const box = v.parentElement, cs = getComputedStyle(box);
      const avail = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      if (avail <= 0) return;                       // kartu belum tampil (tersembunyi)
      let size = parseFloat(getComputedStyle(v).fontSize);
      while (v.scrollWidth > avail + 0.5 && size > 10) { size -= 0.5; v.style.fontSize = size + 'px'; }
      sizes.push(size);
    });
    /* kedua nominal memakai ukuran yang sama (yang terkecil) supaya tampak seragam */
    if (sizes.length) { const small = Math.min(...sizes); vs.forEach(v => { if (parseFloat(getComputedStyle(v).fontSize) > small) v.style.fontSize = small + 'px'; }); }
    /* pill persentase: usahakan satu baris (huruf dikecilkan sedikit), kalau masih kepanjangan baru terlipat */
    document.querySelectorAll('.bh-st .bh-trend').forEach(t => {
      t.style.fontSize = '';
      const cs = getComputedStyle(t), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      let size = parseFloat(cs.fontSize);
      const wrapped = () => t.offsetHeight > parseFloat(getComputedStyle(t).lineHeight) + pad + 2;
      while (wrapped() && size > 9.5) { size -= 0.5; t.style.fontSize = size + 'px'; }
    });
    busy = false;
  }
  window.fitBhValues = fitBhValues;
  if (typeof renderBeranda === 'function') {
    const baseRender = renderBeranda;
    renderBeranda = function (k) { baseRender(k); fitBhValues(); };
  }
  const stats = document.querySelector('.bh-stats');
  if (stats && window.ResizeObserver) new ResizeObserver(fitBhValues).observe(stats);
  window.addEventListener('resize', fitBhValues);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitBhValues);
  fitBhValues();
})();
</script>
